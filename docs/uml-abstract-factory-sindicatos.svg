<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
  <defs>
    <marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#38546f" stroke-width="1.5"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38546f"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #244766; stroke-width: 2; }
      .blue { fill: #eef7ff; stroke: #39739d; stroke-width: 2; }
      .green { fill: #effaf3; stroke: #39734a; stroke-width: 2; }
      .head { fill: #d9eaf7; stroke: #244766; stroke-width: 2; }
      .headBlue { fill: #cfe8fa; stroke: #39739d; stroke-width: 2; }
      .headGreen { fill: #d7f0dd; stroke: #39734a; stroke-width: 2; }
      .title { font: bold 17px Arial, sans-serif; fill: #17324d; }
      .text { font: 14px Arial, sans-serif; fill: #203040; }
      .stereo { font: italic 13px Arial, sans-serif; fill: #536b7d; }
      .impl { fill: none; stroke: #38546f; stroke-width: 2; stroke-dasharray: 8 5; marker-end: url(#triangle); }
      .create { fill: none; stroke: #38546f; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .assoc { fill: none; stroke: #38546f; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="600" y="34" text-anchor="middle" class="title" font-size="25">
    Abstract Factory — Sistema de Sindicatos
  </text>
  <text x="600" y="59" text-anchor="middle" class="text">
    Duas famílias de produtos relacionadas, criadas por fábricas diferentes
  </text>

  <!-- Fábrica abstrata -->
  <rect x="400" y="85" width="400" height="115" class="box"/>
  <rect x="400" y="85" width="400" height="36" class="head"/>
  <text x="600" y="110" text-anchor="middle" class="title">FabricaSindical</text>
  <text x="420" y="146" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="420" y="172" class="text">+ criarCarteira(): CarteiraSindical</text>
  <text x="420" y="191" class="text">+ criarBoletim(): BoletimSindical</text>

  <!-- Fábricas concretas -->
  <rect x="80" y="255" width="350" height="115" class="blue"/>
  <rect x="80" y="255" width="350" height="36" class="headBlue"/>
  <text x="255" y="280" text-anchor="middle" class="title">FabricaMetalurgicos</text>
  <text x="100" y="320" class="text">+ criarCarteira()</text>
  <text x="100" y="344" class="text">+ criarBoletim()</text>
  <text x="100" y="363" class="stereo">família Metalúrgicos</text>

  <rect x="770" y="255" width="350" height="115" class="green"/>
  <rect x="770" y="255" width="350" height="36" class="headGreen"/>
  <text x="945" y="280" text-anchor="middle" class="title">FabricaProfessores</text>
  <text x="790" y="320" class="text">+ criarCarteira()</text>
  <text x="790" y="344" class="text">+ criarBoletim()</text>
  <text x="790" y="363" class="stereo">família Professores</text>

  <!-- Interfaces de produtos -->
  <rect x="90" y="445" width="300" height="95" class="box"/>
  <rect x="90" y="445" width="300" height="34" class="head"/>
  <text x="240" y="469" text-anchor="middle" class="title">CarteiraSindical</text>
  <text x="110" y="501" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="110" y="526" class="text">+ emitir(nomeAssociado)</text>

  <rect x="810" y="445" width="300" height="95" class="box"/>
  <rect x="810" y="445" width="300" height="34" class="head"/>
  <text x="960" y="469" text-anchor="middle" class="title">BoletimSindical</text>
  <text x="830" y="501" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="830" y="526" class="text">+ publicar()</text>

  <!-- Produtos concretos -->
  <rect x="50" y="635" width="300" height="105" class="blue"/>
  <rect x="50" y="635" width="300" height="34" class="headBlue"/>
  <text x="200" y="659" text-anchor="middle" class="title">CarteiraMetalurgicos</text>
  <text x="70" y="696" class="text">+ emitir(nomeAssociado)</text>
  <text x="70" y="721" class="stereo">implements CarteiraSindical</text>

  <rect x="370" y="635" width="300" height="105" class="blue"/>
  <rect x="370" y="635" width="300" height="34" class="headBlue"/>
  <text x="520" y="659" text-anchor="middle" class="title">BoletimMetalurgicos</text>
  <text x="390" y="696" class="text">+ publicar()</text>
  <text x="390" y="721" class="stereo">implements BoletimSindical</text>

  <rect x="530" y="635" width="300" height="105" class="green"/>
  <rect x="530" y="635" width="300" height="34" class="headGreen"/>
  <text x="680" y="659" text-anchor="middle" class="title">CarteiraProfessores</text>
  <text x="550" y="696" class="text">+ emitir(nomeAssociado)</text>
  <text x="550" y="721" class="stereo">implements CarteiraSindical</text>

  <rect x="850" y="635" width="300" height="105" class="green"/>
  <rect x="850" y="635" width="300" height="34" class="headGreen"/>
  <text x="1000" y="659" text-anchor="middle" class="title">BoletimProfessores</text>
  <text x="870" y="696" class="text">+ publicar()</text>
  <text x="870" y="721" class="stereo">implements BoletimSindical</text>

  <!-- Cliente -->
  <rect x="425" y="785" width="350" height="50" class="box"/>
  <text x="600" y="816" text-anchor="middle" class="title">AssembleiaSindical (cliente)</text>

  <!-- Heranças e criações: cada caminho fica na sua área -->
  <path d="M510 200 L255 255" class="impl"/>
  <path d="M690 200 L945 255" class="impl"/>

  <path d="M255 370 L255 425 L240 445" class="create"/>
  <path d="M945 370 L945 425 L960 445" class="create"/>

  <path d="M200 635 L240 540" class="impl"/>
  <path d="M520 635 L520 580 L1160 580 L960 540" class="impl"/>
  <path d="M680 635 L680 570 L40 570 L240 540" class="impl"/>
  <path d="M1000 635 L960 540" class="impl"/>

  <path d="M600 785 L600 200" class="assoc"/>
  <text x="615" y="770" class="text">usa a fábrica</text>

  <text x="600" y="610" text-anchor="middle" class="stereo">produtos concretos das famílias</text>
  <line x1="75" y1="820" x2="145" y2="820" class="impl"/>
  <text x="155" y="825" class="text">implementação</text>
  <line x1="280" y1="820" x2="350" y2="820" class="create"/>
  <text x="360" y="825" class="text">criação</text>
</svg>
